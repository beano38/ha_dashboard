kiosk_mode:
  non_admin_settings:
    kiosk: true
    ignore_entity_settings: true
  entity_settings:
    - entity:
        input_boolean.kiosk_mode: "on"
      hide_header: true
    - entity:
        input_boolean.kiosk_mode: "off"
      hide_header: false
views:
  - type: masonry
    card_mod: null
    style: |
      ha-card {
        bottom: 0;
        right: 0;
        left: 0;
        z-index: 5;
        position: fixed;
      }

    cards:
      # Button Stack at Top Row
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
            - type: template
              tap_action:
                action: navigate
                navigation_path: "#shopping"
              entity: todo.mealie_weekly_meals
              icon: mdi:cart-variant
              icon_color: |2-
                  {% if states('todo.mealie_weekly_meals') | int > 0 %}
                    #FFB200
                  {% else %}
                    dark
                  {% endif %}
              content: "{{states('todo.mealie_weekly_meals')}}"
              hold_action:
                action: none
              double_tap_action:
                action: none

            - type: action
              tap_action:
                action: navigate
                navigation_path: "#cameras"
              icon: mdi:cctv
      # END button stack at top row
      # weather
      - type: weather-forecast
        show_current: true
        show_forecast: true
        entity: weather.forecast_home
        secondary_info_attribute: humidity
        forecast_type: daily
        forecast_slots: 5
        card_mod:
          style: |
            ha-card {
              background: none;
              box-shadow: none;
              border: none;
            }
      # Room Cards
      - type: custom:layout-card
        layout_type: grid
        layout:
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr))
          grid-gap: 8px
          margin: 0
        cards:
          # ---- Living Room Card ----
          - type: custom:stack-in-card
            mode: horizontal
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Living Room
                    secondary: >-
                      {{ states('sensor.main_floor_temperature') | round(0) }}°F |
                      {{ states('sensor.upstairs_outdoor_humidity') | round(0) }}%
                    card_mod:
                      style:
                        mushroom-shape-icon$: |
                          .shape {
                            display: none !important;
                          }
                        .: |
                          ha-card {
                            border: 0px;
                            padding-left: 10px;
                            padding-top: 10px;
                            width: 100%;
                            min_width: 0;
                          }
                  - type: custom:mushroom-legacy-template-card
                    entity: switch.bedroom_lights_smart_plug
                    layout: horizontal
                    icon: mdi:sofa-outline
                    tap_action:
                      action: navigate
                      navigation_path: "#livingroom"
                    hold_action:
                      action: more-info
                    double_tap_action:
                      action: more-info
                    icon_color: >-
                      {% if is_state('light.livingroom_lights', 'on')
                        or is_state('switch.livingroom_switches', 'on')
                        or is_state('media_player.livingroom_mediaplayers', 'on')%}
                          #2973B2
                      {% else %}
                          #7A7A7F
                      {% endif %}
                    primary_info: none
                    secondary_info: none
                    card_mod:
                      style:
                        mushroom-shape-icon$: |
                          .shape {
                            --icon-size: 135px;
                          }
                        .: |
                          ha-card {
                            border: 0px;
                            margin-left: -30px;
                            margin-top: -20px;
                          }
              # ---- Chips ----
              - type: custom:mushroom-chips-card
                chips:

                  # Switches
                  - type: template
                    entity: switch.livingroom_switches
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    double_tap_action:
                      action: more-info
                    icon: mdi:light-switch-off
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('switch.livingroom_switches', 'on') %} #2973B2 {% else %} #353535 {% endif %};
                          --color: {% if is_state('switch.livingroom_switches', 'on') %} #ffffff {% else %} #ebeaea {% endif %};
                          justify-content: center;
                          height: 35px !important;
                          width: 35px !important;
                          border: 0 !important;
                          box-shadow: none !important;
                          border-radius: 22px !important;
                        }
                  # Media
                  - type: template
                    entity: media_player.livingroom_mediaplayers
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    double_tap_action:
                      action: none
                    icon: mdi:television
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: 
                          {% if is_state('media_player.livingroom_mediaplayers', 'on') %}
                          #835a3e 
                          {% else %}
                          #353535 
                          {% endif %};
                          --color: 
                          {% if is_state('media_player.livingroom_mediaplayers', 'on') %}
                          #ffffff
                          {% else %}
                          #ebeaea
                          {% endif %};
                          justify-content: center;
                          height: 35px !important;
                          width: 35px !important;
                          border: 0 !important;
                          box-shadow: none !important;
                          border-radius: 22px !important;
                        }
                card_mod:
                  style: |
                    .chip-container {
                      flex-flow: column wrap-reverse !important;
                      display: flex !important;
                      --chip-spacing: 8px;
                      margin: 12px;
                    }
                    .: |
                    .container {
                      align: end;
                    }
              # ---- End Chips ----
            card_mod:
              style: |
                ha-card {
                  width: 100%;
                  max-width: 100%;
                  min-width: 0;
                  height: 185px;
                  background: none;
                  box-shadow: 0.5px;
                  border: none;
                }
          # ---- End Living Room Card ----
          # ---- Dining Room Card ----
