kiosk_mode:
  non_admin_settings:
    kiosk: true
    ignore_entity_settings: true
  entity_settings:
    - entity:
        input_boolean.kiosk_mode: "on"
      hide_header: true
    - entity:
        input_boolean.kiosk_mode: "off"
      hide_header: false
views:
  - type: masonry
    card_mod: null
    style: |
      ha-card {
      bottom: 0;
      right: 0;
      left: 0;
      z-index: 5;
      position: fixed;
      }
    cards:
      - type: horizontal-stack
        cards:
        # Room Cards
          # ---- Living Room Card ----
          - type: custom:stack-in-card
            mode: horizontal
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Living Room
                    secondary: >-
                      {{ states('sensor.main_floor_temperature')|round(0) }}°F |
                      {{ states('sensor.main_floor_outdoor_humidity')|round(0) }}%
                    card_mod:
                      style:
                        mushroom-shape-icon$: |
                          .shape {
                            display: none !important;
                          }
                        .: |
                          ha-card {
                            border: 0px;
                            padding-left: 10px;
                            padding-top: 10px;
                            width: 500px;
                          }
                  - type: custom:mushroom-legacy-template-card
                    entity: switch.bedroom_lights_smart_plug
                    layout: horizontal
                    icon: mdi:sofa-outline
                    tap_action:
                      action: navigate
                      navigation_path: "#livingroom"
                    hold_action:
                      action: more-info
                    double_tap_action:
                      action: more-info
                    icon_color: >-
                      {% if is_state('switch.livingroom_switches', 'on') 
                      }
                      or is_state('media_player.media_player.living_room_tv_un82ru8000fxza','on') %}                      #2973B2 
                      {% else %}
                        #7A7A7F 
                      {% endif %}
                    primary_info: none
                    secondary_info: none
                    card_mod:
                      style:
                        mushroom-shape-icon$: |
                          .shape {
                            --icon-size: 135px;
                          }
                        .: |
                          ha-card {
                            border: 0px;
                            margin-left: -30px;
                            margin-top: -20px;

                          }
              # ---- Chips ----
              - type: custom:mushroom-chips-card
                chips:
                  # Switches
                  - type: template
                    entity: switch.livingroom_switches
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    double_tap_action:
                      action: more-info
                    icon: mdi:light-switch-off
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: {% if is_state('switch.livingroom_switches', 'on') %} #2973B2 {% else %} #353535 {% endif %};
                          --color: {% if is_state('switch.livingroom_switches', 'on') %} #ffffff {% else %} #ebeaea {% endif %};
                          justify-content: center;
                          height: 35px !important;
                          width: 35px !important;
                          border: 0 !important;
                          box-shadow: none !important;
                          border-radius: 22px !important;
                        }                  # Media
                  - type: template
                    entity: media_player.livingroom_mediaplayers
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    double_tap_action:
                      action: none
                    icon: mdi:television
                    card_mod:
                      style: |
                        ha-card {
                          --chip-background: 
                          {% if is_state('media_player.livingroom_mediaplayers', 'on') %}
                          #835a3e 
                          {% else %}
                          #353535 
                          {% endif %};
                          --color: 
                          {% if is_state('media_player.livingroom_mediaplayers', 'on') %}
                          #ffffff
                          {% else %}
                          #ebeaea
                          {% endif %};
                          justify-content: center;
                          height: 35px !important;
                          width: 35px !important;
                          border: 0 !important;
                          box-shadow: none !important;
                          border-radius: 22px !important;
                        }
              # ---- End Chips ----

            card_mod:
              style: |
                ha-card {
                  max-width: 100%;
                  min-width: 50%;
                  height: 185px;
                  background: none;
                  box-shadow: 0.5px;
                  border: none;
                }
