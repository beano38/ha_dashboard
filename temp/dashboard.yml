      # Top Row Popups
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#shopping"
        button_type: name
        name: Shopping Cart
        icon: mdi:cart-heart
        sub_button:
          main: []
          bottom: []
        show_header: true
        auto_close: "0"
        margin: 7px
        close_on_click: false
        card_layout: normal
        cards:
          - display_order: none
            type: todo-list
            entity: todo.mealie_weekly_meals
            theme: Tablet
            hide_completed: false
            hide_create: false
            grid_options:
              columns: 12
              rows: auto
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#cameras"
        button_type: name
        icon: mdi:cctv
        name: Security
        card_layout: normal
        auto_close: "598000"
        sub_button:
          main: []
          bottom: []
        cards:
          - show_state: false
            show_name: true
            camera_view: auto
            type: picture-entity
            entity: camera.garage_interior
            theme: Mushroom Rounded Edge - RB
            grid_options:
              columns: 12
              rows: auto
          - show_state: false
            show_name: true
            camera_view: auto
