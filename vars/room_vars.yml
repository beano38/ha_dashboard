weather:
  entity: weather.forecast_home

# Top Row Important Chips
climate:
  - name: Living Room Thermostat
    climate: climate.main_floor
    sensor_temp: sensor.main_floor_temperature
    sensor_outdoor_temp: sensor.main_floor_outdoor_temperature
    sensor_humidity: sensor.main_floor_humidity
    sensor_outdoor_humidity: sensor.main_floor_outdoor_humidity
  - name: Upstairs Thermostat
    climate: climate.upstairs
    sensor_temp: sensor.upstairs_temperature
    sensor_outdoor_temp: sensor.upstairs_outdoor_temperature
    sensor_humidity: sensor.upstairs_humidity
    sensor_outdoor_humidity: sensor.upstairs_outdoor_humidity

todo:
  entity: todo.mealie_weekly_meals
cameras:
  - name: Garage
    entity: camera.garage_interior
  - name: Mancave
    entity: camera.bar
  - name: Pool
    entity: camera.back_yard
  - name: Ring Front Door
    entity: camera.front_door_snapshot
pool:
  water_temp:
    entity: sensor.backyard_pool_pool_water_temperature
  air_temp:
    entity: sensor.backyard_pool_air_temperature
  filter_pump:
    entity: switch.backyard_pool_pool_filter_pump

kiosk_mode: false

rooms:
  - name: Living Room
    icon: mdi:sofa-outline
    plug: livingroom
    active_color: "#2973B2"
    environment:
      temp_entity: sensor.main_floor_temperature
      humidity_entity: sensor.upstairs_outdoor_humidity
    switches:
      - entity: switch.plug_6
        name: Christmas Tree Lights
    media:
      - type: tv
        entity: media_player.living_room_tv_un82ru8000fxza

  - name: Office
    icon: mdi:remote-desktop
    plug: office
    active_color: "#3D8D7A"
    environment:
      temp_entity: sensor.h5075_f388_temperature
      humidity_entity: sensor.h5075_f388_humidity
    lights:
      - entity: light.office_overhead
        name: Fan Light
    switches:
      - entity: switch.plug_4
        name: Darth Vader
    media:
      - type: roku 
        name: Office Roku
        entity: media_player.office_roku_office
  - name: Master Bedroom
    icon: mdi:bed-king-outline
    plug: master_bedroom
    active_color: "#c8ab60"
    switches:
      - entity: switch_plug_8
        name: Sexy Time
    media:
      - type: roku
        name: Roku Bedroom
        entity: media_player.master_bedroom_master_bedroom
  - name: Sunroom
    icon: mdi:weather-sunny
    plug: sunroom
    active_color: "#AA4DC4"
    environment:
      temp_entity: sensor.h5075_6832_temperature
      humidity_entity: sensor.h5075_6832_humidity
    switches:
      - entity: switch.plug_5
        name: Xmas Tree
    media:
      - type: tv
        entity: media_player.lg_webos_tv_uq8000aub
  - name: Foyer
    icon: mdi:door
    plug: foyer
    active_color: "#2973B2"
    lights:
      - entity: light.dining_room_leg_lamp
        name: Leg Lamp
      - entity: light.porch_1
        name: Porch Left
      - entity: light.porch_2
        name: Porch Center
      - entity: light.porch_3
        name: Porch Right
  - name: Kitchen
    icon: mdi:fridge-outline
    plug: kitchen
    active_color: "#3D8D7A"
